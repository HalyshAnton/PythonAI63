
# Основна інформація про проєкт
[project]
name = "python-ai63"
version = "0.1.0"
description = "ITStep course for students"
requires-python = ">=3.10"


# Налаштування Ruff — аналіз коду
[tool.ruff]

# Максимальна довжина рядка коду
line-length = 88

# Версія Python, для якої перевіряється код
target-version = "py312"


# Правила перевірки коду Ruff
[tool.ruff.lint]

# E — помилки стилю коду (pycodestyle)
# F — пошук потенційних помилок (Pyflakes)
# W — попередження про стиль коду
# I — перевірка та сортування імпортів
# B — пошук потенційних помилок (flake8-bugbear)
# UP — рекомендації щодо сучасного синтаксису Python
select = ["E", "F", "W", "I", "B", "UP"]

# Правила, які не потрібно застосовувати
ignore = [
    "E203",  # Сумісність форматування з Black
]


# Налаштування Black — форматування коду
[tool.black]
# Максимальна довжина рядка коду
line-length = 88
# Версія Python, для якої виконується форматування
target-version = ["py312"]
